<!doctype html>
<html><head><meta charset="utf-8"><title>Delivery Motion</title>
<style>html,body{margin:0;background:#111}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const F = '"SF Pro Display", system-ui, -apple-system, "Helvetica Neue", sans-serif';
const C = {
  primary: '#FF5A1F', primaryDark: '#E04712', primarySoft: '#FFD3C0',
  ink: '#1B1B2F', gray: '#8A90A0', light: '#EEF0F3', green: '#16C784',
  street: '#FFFFFF', block: '#EDEFF3', bld: '#E1E4EA', bld2: '#E6E9EE',
  park: '#CDEFD6', tree: '#A9E1B9', water: '#BFE1FF',
};

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = x => 1 - Math.pow(1 - x, 3);
const esine = x => -(Math.cos(Math.PI * x) - 1) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

// ---------- map data ----------
const R = rng(42);
const xs = [], ys = [];
for (let x = -720; x <= 1800; x += 180) xs.push(x);
for (let y = -900; y <= 2520; y += 180) ys.push(y);
const mainX = new Set([540]), mainY = new Set([900]);
const half = (main) => main ? 26 : 15;
const blocks = [];
for (let i = 0; i < xs.length - 1; i++) for (let j = 0; j < ys.length - 1; j++) {
  const x0 = xs[i] + half(mainX.has(xs[i])), x1 = xs[i + 1] - half(mainX.has(xs[i + 1]));
  const y0 = ys[j] + half(mainY.has(ys[j])), y1 = ys[j + 1] - half(mainY.has(ys[j + 1]));
  const isPark = (xs[i] === 720 && ys[j] === 360) || (xs[i] === 180 && ys[j] === 1440) || (xs[i] === 1080 && ys[j] === 1260) || R() < 0.06;
  const b = { x0, y0, w: x1 - x0, h: y1 - y0, park: isPark, sub: [], trees: [] };
  if (isPark) {
    for (let k = 0; k < 9; k++) b.trees.push([x0 + 18 + R() * (b.w - 36), y0 + 18 + R() * (b.h - 36), 8 + R() * 8]);
  } else {
    const cols = R() < .5 ? 2 : 3, rows = R() < .5 ? 2 : 3, g = 8, p = 10;
    const cw = (b.w - 2 * p - (cols - 1) * g) / cols, ch = (b.h - 2 * p - (rows - 1) * g) / rows;
    for (let a = 0; a < cols; a++) for (let c = 0; c < rows; c++) if (R() > .12)
      b.sub.push([x0 + p + a * (cw + g), y0 + p + c * (ch + g), cw, ch, R() < .5 ? C.bld : C.bld2]);
  }
  blocks.push(b);
}
const labels = [
  { t: 'Av. Brasil', x: 540, y: 1180, rot: -Math.PI / 2 },
  { t: 'Av. Central', x: 260, y: 900, rot: 0 },
  { t: 'R. das Flores', x: 360, y: 560, rot: -Math.PI / 2 },
  { t: 'R. Aurora', x: 1060, y: 540, rot: 0 },
  { t: 'R. dos Ipês', x: 900, y: 1480, rot: -Math.PI / 2 },
];

function drawMap() {
  ctx.fillStyle = C.street; ctx.fillRect(-2000, -2000, 6000, 6000);
  for (const b of blocks) {
    rr(b.x0, b.y0, b.w, b.h, 10); ctx.fillStyle = b.park ? C.park : C.block; ctx.fill();
    if (b.park) { ctx.fillStyle = C.tree; for (const [x, y, r] of b.trees) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); } }
    for (const [x, y, w, h, col] of b.sub) { rr(x, y, w, h, 5); ctx.fillStyle = col; ctx.fill(); }
  }
  // lake
  ctx.fillStyle = C.water;
  ctx.beginPath();
  ctx.moveTo(-160, 960); ctx.bezierCurveTo(-60, 900, 120, 920, 160, 1000);
  ctx.bezierCurveTo(200, 1100, 150, 1240, 40, 1250);
  ctx.bezierCurveTo(-80, 1262, -190, 1200, -180, 1100);
  ctx.bezierCurveTo(-176, 1030, -200, 990, -160, 960); ctx.fill();
  // labels
  ctx.fillStyle = '#A3A9B6'; ctx.font = `600 17px ${F}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const l of labels) { ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot); ctx.fillText(l.t, 0, 0); ctx.restore(); }
}

// ---------- route ----------
const route = [[260, 180], [540, 180], [540, 720], [900, 720], [900, 1080], [720, 1080], [720, 1260], [620, 1260]];
const cum = [0];
for (let i = 1; i < route.length; i++) cum.push(cum[i - 1] + Math.hypot(route[i][0] - route[i - 1][0], route[i][1] - route[i - 1][1]));
const L = cum[cum.length - 1];
function segAt(d) { d = clamp(d, 0, L); let i = 1; while (i < route.length - 1 && cum[i] < d) i++; return i; }
function pointAt(d) {
  d = clamp(d, 0, L); const i = segAt(d);
  const a = route[i - 1], b = route[i], f = (d - cum[i - 1]) / (cum[i] - cum[i - 1]);
  return [lerp(a[0], b[0], f), lerp(a[1], b[1], f)];
}
const facing = []; { let f = 1; for (let i = 1; i < route.length; i++) { const dx = route[i][0] - route[i - 1][0]; if (dx) f = Math.sign(dx); facing[i] = f; } }
function subpath(d0, d1) {
  const pts = [pointAt(d0)];
  for (let i = 1; i < route.length - 1; i++) if (cum[i] > d0 && cum[i] < d1) pts.push(route[i]);
  pts.push(pointAt(d1)); return pts;
}
const REST = route[0], HOME = route[route.length - 1];
const routeCenter = [580, 690];

// ---------- camera ----------
const VIEW_CY = 790, BASE_S = 0.8;
let cam = { s: 1, cx: 0, cy: 0 };
const toScreen = ([x, y]) => [(x - cam.cx) * cam.s + W / 2, (y - cam.cy) * cam.s + VIEW_CY];

// ---------- icons ----------
function pin(x, y, sc, color, icon) {
  if (sc <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0, 0, 22, 8, 0, 0, 7); ctx.fill();
  ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(0, 0); ctx.bezierCurveTo(-14, -26, -46, -50, -46, -86);
  ctx.arc(0, -86, 46, Math.PI, 0); ctx.bezierCurveTo(46, -50, 14, -26, 0, 0); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -86, 32, 0, 7); ctx.fill();
  ctx.translate(0, -86); icon(); ctx.restore();
}
function iconFood() {
  ctx.strokeStyle = C.primary; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-9, -16); ctx.lineTo(-9, 16); ctx.moveTo(-15, -16); ctx.lineTo(-15, -4); ctx.moveTo(-3, -16); ctx.lineTo(-3, -4);
  ctx.moveTo(-15, -4); ctx.quadraticCurveTo(-9, 2, -3, -4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(11, 16); ctx.lineTo(11, -16); ctx.quadraticCurveTo(20, -8, 17, 4); ctx.lineTo(11, 4); ctx.stroke();
}
function iconHome() {
  ctx.fillStyle = C.ink; ctx.beginPath();
  ctx.moveTo(0, -19); ctx.lineTo(19, -2); ctx.lineTo(14, -2); ctx.lineTo(14, 16); ctx.lineTo(-14, 16); ctx.lineTo(-14, -2); ctx.lineTo(-19, -2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; rr(-5, 4, 10, 12, 2); ctx.fill();
}
function scooter(t, moving) {
  // side-view scooter facing right, ~80px wide
  const spin = t * 30;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // box
  ctx.fillStyle = C.primary; rr(-38, -40, 30, 28, 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(-38, -30, 30, 5);
  // rider
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.moveTo(-8, -10); ctx.lineTo(2, -38); ctx.lineTo(12, -36); ctx.lineTo(8, -10); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(8, -30); ctx.lineTo(22, -22); ctx.stroke();
  ctx.fillStyle = C.primary; ctx.beginPath(); ctx.arc(6, -46, 11, 0, 7); ctx.fill();
  ctx.fillStyle = C.ink; rr(8, -50, 9, 6, 3); ctx.fill();
  // body
  ctx.fillStyle = C.primaryDark;
  ctx.beginPath(); ctx.moveTo(-34, 2); ctx.lineTo(-10, -10); ctx.lineTo(14, -10); ctx.lineTo(18, 2); ctx.quadraticCurveTo(-8, 12, -34, 2); ctx.fill();
  ctx.strokeStyle = C.primaryDark; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(18, 2); ctx.lineTo(26, -26); ctx.stroke();
  ctx.lineWidth = 5; ctx.strokeStyle = C.ink; ctx.beginPath(); ctx.moveTo(20, -26); ctx.lineTo(32, -26); ctx.stroke();
  // wheels
  for (const wx of [-24, 26]) {
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(wx, 10, 12, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(wx, 10, 5, 0, 7); ctx.fill();
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(wx + Math.cos(spin) * 5, 10 + Math.sin(spin) * 5); ctx.lineTo(wx - Math.cos(spin) * 5, 10 - Math.sin(spin) * 5); ctx.stroke();
  }
}
function motoBadge(x, y, sc, dir, t, moving) {
  if (sc <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  // pulse
  const pr = (t * 1.2) % 1;
  ctx.fillStyle = `rgba(255,90,31,${0.25 * (1 - pr)})`; ctx.beginPath(); ctx.arc(0, 0, 60 + pr * 50, 0, 7); ctx.fill();
  ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 8;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 62, 0, 7); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = C.primary; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 0, 58, 0, 7); ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, 54, 0, 7); ctx.clip();
  const bob = moving ? Math.sin(t * 38) * 1.6 : 0;
  ctx.translate(0, 8 + bob); ctx.scale(dir * 0.82, 0.82);
  if (moving) { // speed lines
    ctx.strokeStyle = 'rgba(27,27,47,.25)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (let k = 0; k < 3; k++) { const o = ((t * 4 + k / 3) % 1) * 20; ctx.beginPath(); ctx.moveTo(-58 - o, -22 + k * 14); ctx.lineTo(-44 - o, -22 + k * 14); ctx.stroke(); }
  }
  scooter(t, moving); ctx.restore();
  ctx.restore();
}

// ---------- confetti ----------
const CR = rng(7), confetti = [];
const cCols = [C.primary, C.green, '#FFC531', '#4C7DFF', '#FF4D8D'];
for (let i = 0; i < 140; i++) {
  const a = -Math.PI / 2 + (CR() - .5) * 2.2, sp = 700 + CR() * 900;
  confetti.push({ vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, c: cCols[i % 5], w: 10 + CR() * 10, h: 6 + CR() * 8, r: CR() * 6, vr: (CR() - .5) * 18 });
}

// ---------- UI pieces ----------
function txt(s, x, y, size, weight, color, align = 'left', base = 'alphabetic') {
  ctx.font = `${weight} ${size}px ${F}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y);
}
function rollingNumber(v, x, y, size) {
  const n = Math.ceil(v - 1e-6);
  const frac = n - v; // 0 right after crossing
  const r = (v <= 0 || n >= MIN0 || frac < 1e-4) ? 1 : eout(clamp(frac / 0.55));
  const h = size * 1.05;
  ctx.save(); ctx.beginPath(); ctx.rect(x - 10, y - size * 0.95, 260, size * 1.15); ctx.clip();
  ctx.globalAlpha = 1;
  txt(String(n), x, y + (1 - r) * h, size, 800, C.ink);
  if (r < 1) { ctx.globalAlpha = 1 - r; txt(String(n + 1), x, y - r * h, size, 800, C.ink); }
  ctx.restore();
  ctx.font = `800 ${size}px ${F}`; return ctx.measureText(String(n)).width;
}

function drawSheet(t, st) {
  const y0 = 1290 + (1 - eout(prog(t, 2.3, 2.95))) * 720;
  ctx.save();
  ctx.shadowColor = 'rgba(20,20,40,.18)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = -6;
  rr(0, y0, W, H - y0 + 60, [48, 48, 0, 0]); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.shadowColor = 'transparent';
  rr(W / 2 - 40, y0 + 18, 80, 9, 5); ctx.fillStyle = '#DADDE3'; ctx.fill();

  const done = st.arrived;
  // ETA
  txt(done ? 'Entregue em' : 'Chega em', 64, y0 + 92, 32, 600, C.gray);
  const nw = rollingNumber(st.minutes, 60, y0 + 200, 120);
  txt('min', 60 + nw + 14, y0 + 200, 44, 700, C.gray);
  // status (right)
  const sa = prog(t, st.statusT, st.statusT + .3);
  ctx.save(); ctx.globalAlpha = sa;
  const sy = (1 - eout(sa)) * 18;
  txt(st.status, W - 64, y0 + 120 + sy, 40, 800, st.statusColor, 'right');
  txt(st.sub, W - 64, y0 + 168 + sy, 30, 500, C.gray, 'right');
  ctx.restore();
  // progress
  const bx0 = 110, bx1 = W - 110, by = y0 + 268;
  rr(bx0, by - 6, bx1 - bx0, 12, 6); ctx.fillStyle = C.light; ctx.fill();
  const f = st.bar;
  if (f > 0) { rr(bx0, by - 6, (bx1 - bx0) * f, 12, 6); ctx.fillStyle = done ? C.green : C.primary; ctx.fill(); }
  const names = ['Confirmado', 'Preparado', 'A caminho', 'Entregue'];
  names.forEach((nm, i) => {
    const p = i / 3, x = lerp(bx0, bx1, p), on = f >= p - 1e-3;
    ctx.beginPath(); ctx.arc(x, by, on ? 20 : 16, 0, 7); ctx.fillStyle = on ? (done ? C.green : C.primary) : '#fff'; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = on ? '#fff' : '#D3D7DE'; ctx.stroke();
    if (on) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(x - 8, by); ctx.lineTo(x - 2, by + 6); ctx.lineTo(x + 9, by - 6); ctx.stroke(); }
    txt(nm, x, by + 58, 26, on ? 700 : 500, on ? C.ink : C.gray, 'center');
  });
  // divider
  ctx.fillStyle = C.light; ctx.fillRect(64, y0 + 370, W - 128, 3);
  // courier
  const cy = y0 + 470;
  ctx.beginPath(); ctx.arc(124, cy, 56, 0, 7); ctx.fillStyle = C.primarySoft; ctx.fill();
  txt('RM', 124, cy + 2, 38, 800, C.primaryDark, 'center', 'middle');
  ctx.beginPath(); ctx.arc(166, cy + 40, 16, 0, 7); ctx.fillStyle = C.green; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.stroke();
  txt('Rafael M.', 208, cy - 10, 40, 800, C.ink);
  txt('★ 4,9  ·  Honda CG 160  ·  FXT-2K41', 208, cy + 38, 28, 500, C.gray);
  ctx.beginPath(); ctx.arc(W - 120, cy, 52, 0, 7); ctx.fillStyle = C.primary; ctx.fill();
  // phone glyph
  ctx.save(); ctx.translate(W - 120, cy); ctx.rotate(-0.6); ctx.fillStyle = '#fff';
  rr(-9, -22, 18, 44, 7); ctx.fill(); ctx.fillStyle = C.primary; ctx.fillRect(-4, -12, 8, 24); ctx.restore();
  ctx.restore();
}

function drawHeader(t) {
  const off = -(1 - eout(prog(t, 2.4, 2.95))) * 260;
  ctx.save(); ctx.translate(0, off);
  // status bar
  txt('20:18', 70, 62, 30, 700, C.ink);
  ctx.fillStyle = C.ink; for (let i = 0; i < 4; i++) { rr(W - 190 + i * 11, 54 - i * 6, 7, 8 + i * 6, 2); ctx.fill(); }
  rr(W - 128, 38, 50, 26, 7); ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.stroke(); rr(W - 124, 42, 36, 18, 4); ctx.fill();
  ctx.shadowColor = 'rgba(20,20,40,.15)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 8;
  rr(40, 96, W - 80, 120, 32); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.strokeStyle = C.ink; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(102, 140); ctx.lineTo(84, 156); ctx.lineTo(102, 172); ctx.stroke();
  txt('Pedido #4821', 136, 148, 36, 800, C.ink);
  txt('Sabor da Casa  ·  3 itens  ·  R$ 58,90', 136, 190, 26, 500, C.gray);
  rr(W - 190, 132, 110, 48, 24); ctx.fillStyle = '#FFF1EA'; ctx.fill();
  txt('Ajuda', W - 135, 157, 26, 700, C.primary, 'center', 'middle');
  ctx.restore();
}

function drawConfirm(t) {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#FF7A3D'); g.addColorStop(1, '#F0400F');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // soft background circles
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  ctx.beginPath(); ctx.arc(140 + Math.sin(t) * 20, 300, 260, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(980, 1600 - t * 30, 340, 0, 7); ctx.fill();
  const cx = 540, cy = 760;
  // ripples
  for (let k = 0; k < 2; k++) {
    const rp = prog(t, 0.55 + k * 0.25, 1.6 + k * 0.25);
    if (rp > 0 && rp < 1) { ctx.strokeStyle = `rgba(255,255,255,${0.5 * (1 - rp)})`; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, 150 + rp * 260, 0, 7); ctx.stroke(); }
  }
  const s = back(prog(t, 0.15, 0.65));
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(120,20,0,.35)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 18;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 150, 0, 7); ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.restore();
  const ck = eio(prog(t, 0.55, 0.95));
  if (ck > 0) {
    ctx.save(); ctx.translate(cx, cy);
    const pts = [[-62, 4], [-18, 48], [66, -44]];
    const l1 = Math.hypot(44, 44), l2 = Math.hypot(84, 92), dd = ck * (l1 + l2);
    ctx.strokeStyle = C.green; ctx.lineWidth = 26; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(...pts[0]);
    if (dd <= l1) ctx.lineTo(lerp(pts[0][0], pts[1][0], dd / l1), lerp(pts[0][1], pts[1][1], dd / l1));
    else { ctx.lineTo(...pts[1]); const f = (dd - l1) / l2; ctx.lineTo(lerp(pts[1][0], pts[2][0], f), lerp(pts[1][1], pts[2][1], f)); }
    ctx.stroke(); ctx.restore();
  }
  const ta = eout(prog(t, 0.8, 1.25)), tb = eout(prog(t, 0.95, 1.4)), tc = eout(prog(t, 1.1, 1.55));
  ctx.save(); ctx.globalAlpha = ta; txt('Pedido confirmado!', W / 2, 1060 + (1 - ta) * 40, 76, 800, '#fff', 'center'); ctx.restore();
  ctx.save(); ctx.globalAlpha = tb; txt('O Sabor da Casa já está preparando', W / 2, 1130 + (1 - tb) * 40, 36, 500, 'rgba(255,255,255,.9)', 'center');
  txt('o seu pedido', W / 2, 1176 + (1 - tb) * 40, 36, 500, 'rgba(255,255,255,.9)', 'center'); ctx.restore();
  ctx.save(); ctx.globalAlpha = tc;
  rr(W / 2 - 210, 1250 + (1 - tc) * 40, 420, 84, 42); ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fill();
  txt('Pedido #4821  ·  R$ 58,90', W / 2, 1292 + (1 - tc) * 40, 32, 700, '#fff', 'center', 'middle'); ctx.restore();
}

// ---------- main frame ----------
const T_DEP = 3.35, T_ARR = 8.55, MIN0 = 25;
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  // moto progress
  const mp = esine(prog(t, T_DEP, T_ARR));
  const dMoto = mp * L;
  // camera: overview -> follow moto (smoothed look-at)
  const z = eio(prog(t, 2.95, 3.95));
  let ax = 0, ay = 0, N = 15;
  for (let k = 0; k < N; k++) { const p = pointAt(dMoto + (k / (N - 1) - .5) * 360); ax += p[0]; ay += p[1]; }
  ax /= N; ay /= N;
  cam.s = BASE_S * (1 + 0.42 * z); cam.cx = lerp(routeCenter[0], ax, z); cam.cy = lerp(routeCenter[1], ay, z);
  // intro zoom drift during reveal
  cam.s *= 1 + 0.06 * (1 - eout(prog(t, 1.9, 3.0)));

  ctx.save(); ctx.setTransform(cam.s, 0, 0, cam.s, W / 2 - cam.cx * cam.s, VIEW_CY - cam.cy * cam.s);
  drawMap(); ctx.restore();

  // route
  const dDraw = eio(prog(t, 2.55, 3.25)) * L;
  const line = (pts, w, col) => { ctx.beginPath(); pts.forEach((p, i) => { const s = toScreen(p); i ? ctx.lineTo(...s) : ctx.moveTo(...s); }); ctx.lineWidth = w; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); };
  if (dDraw > 0) {
    const s0 = Math.min(dMoto, dDraw);
    ctx.save(); ctx.shadowColor = 'rgba(224,71,18,.35)'; ctx.shadowBlur = 16;
    line(subpath(s0, dDraw), 26, '#fff'); ctx.restore();
    if (s0 > 0) { ctx.setLineDash([2, 22]); line(subpath(0, s0), 12, '#F5A584'); ctx.setLineDash([]); }
    line(subpath(s0, dDraw), 15, C.primary);
  }
  // pins
  const rs = toScreen(REST), hs = toScreen(HOME);
  const restSc = back(prog(t, 2.45, 2.85));
  let homeSc = back(prog(t, 3.05, 3.45));
  const arr = prog(t, T_ARR, T_ARR + 0.6);
  if (arr > 0) homeSc *= 1 + 0.28 * Math.sin(arr * Math.PI * 3) * (1 - arr);
  // home ripples while waiting
  if (t > 3.2 && t < T_ARR + 0.2) for (let k = 0; k < 2; k++) {
    const rp = ((t * 0.8) + k * .5) % 1;
    ctx.strokeStyle = `rgba(27,27,47,${0.35 * (1 - rp)})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(hs[0], hs[1], 30 + rp * 70, (30 + rp * 70) * 0.45, 0, 0, 7); ctx.stroke();
  }
  if (arr > 0) for (let k = 0; k < 2; k++) {
    const rp = prog(t, T_ARR + .05 + k * .2, T_ARR + 1.0 + k * .2);
    if (rp > 0 && rp < 1) { ctx.strokeStyle = `rgba(22,199,132,${0.7 * (1 - rp)})`; ctx.lineWidth = 7; ctx.beginPath(); ctx.ellipse(hs[0], hs[1], 30 + rp * 140, (30 + rp * 140) * 0.45, 0, 0, 7); ctx.stroke(); }
  }
  pin(rs[0], rs[1], restSc, C.primary, iconFood);
  pin(hs[0], hs[1], homeSc, arr > 0 ? C.green : C.ink, iconHome);

  // moto
  const mpos = toScreen(pointAt(dMoto));
  let msc = back(prog(t, 3.0, 3.35)) * (1 - eio(prog(t, T_ARR - 0.05, T_ARR + 0.25)));
  const dir = facing[segAt(dMoto)];
  motoBadge(mpos[0], mpos[1] - 10, msc * 1.12, dir, t, t > T_DEP && t < T_ARR);

  // confetti
  const ct = t - (T_ARR + 0.1);
  if (ct > 0) for (const c of confetti) {
    const x = hs[0] + c.vx * ct * 0.75, y = hs[1] - 90 + c.vy * ct * 0.75 + 0.5 * 2600 * ct * ct * 0.75;
    ctx.save(); ctx.globalAlpha = clamp(1.6 - ct); ctx.translate(x, y); ctx.rotate(c.r + c.vr * ct);
    ctx.fillStyle = c.c; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h * Math.abs(Math.cos(ct * 9 + c.r))); ctx.restore();
  }

  // UI
  drawHeader(t);
  const arrived = t >= T_ARR + 0.15;
  let status = 'Preparado', sub = 'Aguardando o entregador', statusT = 2.6, col = C.ink;
  if (t >= T_DEP - .2) { status = 'Saiu para entrega'; sub = 'Previsão: 20:43'; statusT = T_DEP - .2; col = C.primary; }
  if (mp > 0.82) { status = 'Chegando!'; sub = 'Fique de olho na porta'; statusT = T_DEP + (T_ARR - T_DEP) * 0.66; }
  if (arrived) { status = 'Pedido entregue!'; sub = 'Bom apetite 😋'; statusT = T_ARR + 0.15; col = C.green; }
  const bar = arrived ? lerp(2 / 3, 1, eout(prog(t, T_ARR, T_ARR + .4))) : lerp(1 / 3, 2 / 3, eout(prog(t, T_DEP - .4, T_DEP))) + mp * 0.3 * (t > T_DEP ? 1 : 0);
  drawSheet(t, { minutes: MIN0 * (1 - mp), status, sub, statusT, statusColor: col, bar: Math.min(bar, 1), arrived });

  // arrival toast
  const ta = back(prog(t, T_ARR + 0.3, T_ARR + 0.75));
  if (ta > 0) {
    ctx.save(); ctx.translate(W / 2, 300); ctx.scale(ta, ta);
    ctx.shadowColor = 'rgba(10,80,50,.35)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
    rr(-330, -62, 660, 124, 62); ctx.fillStyle = C.green; ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.beginPath(); ctx.arc(-262, 0, 40, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = C.green; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-280, 0); ctx.lineTo(-267, 14); ctx.lineTo(-243, -12); ctx.stroke();
    txt('Seu pedido chegou!', -200, 2, 46, 800, '#fff', 'left', 'middle');
    ctx.restore();
  }

  // confirmation overlay with circular reveal
  const rv = eio(prog(t, 1.85, 2.55));
  if (rv < 1) {
    ctx.save();
    if (rv > 0) { ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.moveTo(540 + rv * 2300, 760); ctx.arc(540, 760, rv * 2300, 0, Math.PI * 2, true); ctx.clip('evenodd'); }
    drawConfirm(t); ctx.restore();
  }
}
window.draw = draw;
draw(0);
</script></body></html>
